<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ nombre_proyecto }}</title>
</head>
<body>

    <h1>{{ nombre_proyecto }}</h1>

    <p>{{ descripcion }}</p>

    <h2>Funcionalidades principales</h2>

    <ul>
        {% for funcionalidad in funcionalidades %}
            <li>{{ funcionalidad }}</li>
        {% endfor %}
    </ul>

    <p>
        Cantidad de funcionalidades: {{ cantidad_funcionalidades }}
    </p>

    <p>
        Estado: {{ estado }}
    </p>

</body>
</html>
